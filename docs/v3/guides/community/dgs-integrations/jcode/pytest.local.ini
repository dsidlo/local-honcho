# py.local — standalone pytest config for the jcode honcho integration.
# Scoped so the monorepo root config (testpaths=tests, pythonpath=src) does not
# swallow or interfere with this tree. Run from this directory:
#
#   uv run pytest docs/v3/guides/community/dgs-integrations/jcode --coverage
#
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
addopts = --strict-markers -q
testpaths = tests
markers =
    live: marks tests that need a running local Honcho (http://localhost:8300)
