# py.local — standalone pytest config for the jcode honcho integration.
# Scoped so the monorepo root config (testpaths=tests, pythonpath=src) does not
# interfere with this tree.
#
# Run (from the monorepo root):
#   uv run pytest docs/v3/guides/community/dgs-integrations/jcode \
#       -c docs/v3/guides/community/dgs-integrations/jcode/pytest.local.ini
#
# Coverage (100% gate over the Python sources):
#   ... pytest.local.ini --cov=docs/v3/guides/community/dgs-integrations/jcode/src \
#       --cov-branch --cov-fail-under=100 --cov-report=term-missing
#
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
addopts = --strict-markers
testpaths = tests
markers =
    live: marks tests that need a running local Honcho (http://localhost:8300)