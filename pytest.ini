# Pytest configuration
# Restores the [tool.pytest.ini_options] section that was deleted along with
# pyproject.toml in commit e9e8231. Values match the last committed state of
# that file (parent of e9e8231).
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
addopts = --strict-markers --ignore=tests/alembic
filterwarnings =
    ignore:Call to deprecated close\. \(Use aclose\(\) instead\).*:DeprecationWarning
    ignore:websockets\.legacy is deprecated; see .* for upgrade instructions:DeprecationWarning
    ignore:websockets\.server\.WebSocketServerProtocol is deprecated:DeprecationWarning
testpaths = tests
pythonpath = src
markers =
    sequential: marks tests that must run sequentially (not in parallel)
    integration: marks tests that require external services
    embedding: marks tests that require embedding service
